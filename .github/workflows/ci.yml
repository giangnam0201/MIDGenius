name: MIDGenius

# Heavy lifting (Demucs separation, the ground-truth benchmark, full-track
# conversion) runs here rather than on a laptop.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      audio:
        description: "Audio file in the repo to convert"
        default: "music.mp3"
      quantize:
        description: "Quantise grid (off, 1/8, 1/16, 1/32)"
        default: "off"
      quality:
        description: "fast | good | best"
        default: "good"

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ---------------------------------------------------------------- tests
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install light dependencies
        run: |
          python -m pip install -U pip
          pip install numpy scipy librosa soundfile soxr mido pretty_midi \
                      onnxruntime mir_eval pytest
          # Only the bundled ONNX weights are used, so skip TensorFlow and the
          # legacy resampy pin. resampy must NOT be installed: it needs
          # pkg_resources, which setuptools >= 81 removed, and importing it
          # takes Demucs down with it.
          pip install --no-deps basic-pitch
          ! pip show resampy > /dev/null 2>&1 || (echo "resampy must not be installed" && exit 1)

      - name: Run tests
        run: python -m pytest tests -q

  # ------------------------------------------------------------ evaluate
  evaluate:
    name: Benchmark + convert
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache separation model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch
            ~/.cache/huggingface
          key: demucs-htdemucs-v1

      - name: Install full dependencies
        run: |
          python -m pip install -U pip
          # CPU-only torch: the CUDA wheels are gigabytes and useless here.
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy librosa soundfile soxr mido pretty_midi \
                      onnxruntime mir_eval demucs lameenc pytest
          pip install --no-deps basic-pitch
          pip uninstall -y resampy 2>/dev/null || true

      - name: Show environment
        run: |
          python -c "import torch, librosa, onnxruntime as ort; \
            print('torch', torch.__version__); print('librosa', librosa.__version__); \
            print('ort', ort.__version__)"
          python -c "from midgenius import separation; \
            print('separation backend:', separation.available_backend())"

      - name: Ground-truth benchmark
        run: python tools/benchmark.py --keep artifacts/benchmark | tee artifacts/benchmark.txt

      - name: Convert the track
        env:
          AUDIO: ${{ github.event.inputs.audio || 'music.mp3' }}
          QUANTIZE: ${{ github.event.inputs.quantize || 'off' }}
          QUALITY: ${{ github.event.inputs.quality || 'good' }}
        run: |
          mkdir -p artifacts
          python -m midgenius.cli "$AUDIO" -o artifacts/output.mid \
            --quantize "$QUANTIZE" --quality "$QUALITY" | tee artifacts/convert.txt

      - name: Audit the result against the source audio
        env:
          AUDIO: ${{ github.event.inputs.audio || 'music.mp3' }}
        run: |
          python tools/audit.py "$AUDIO" artifacts/output.mid \
            --render artifacts/preview.wav | tee artifacts/audit.txt

      - name: Summary
        if: always()
        run: |
          {
            echo '## Audit'
            echo '```'
            cat artifacts/audit.txt 2>/dev/null || echo "(no audit)"
            echo '```'
            echo '## Benchmark'
            echo '```'
            cat artifacts/benchmark.txt 2>/dev/null | tail -20 || echo "(no benchmark)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midgenius-output
          path: artifacts/
          retention-days: 14
