name: CI

# Unit tests run on every push/PR (fast, no audio needed). The heavy work -
# Demucs separation and the synthetic benchmark - is manual-only via the
# "Run workflow" button, and can optionally convert an audio file you commit
# or upload, since the copyrighted demo tracks are not shipped in the repo.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      audio:
        description: "Path to an audio file in the repo to convert (optional)"
        default: ""
      quality:
        description: "fast | good | best"
        default: "good"

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

defaults:
  run:
    shell: bash          # -eo pipefail, so a crashed step through `tee` still fails

jobs:
  # ---------------------------------------------------------------- tests
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install light dependencies
        run: |
          python -m pip install -U pip
          pip install numpy scipy librosa soundfile soxr mido pretty_midi \
                      onnxruntime mir_eval pytest
          # Only the bundled ONNX weights are used, so skip TensorFlow and the
          # legacy resampy pin. resampy must NOT be installed: it needs
          # pkg_resources, which setuptools >= 81 removed, and importing it
          # takes Demucs down with it.
          pip install --no-deps basic-pitch
          ! pip show resampy > /dev/null 2>&1 || (echo "resampy must not be installed" && exit 1)

      - name: Run tests
        run: python -m pytest tests -q

  # ------------------------------------------------------- benchmark (manual)
  benchmark:
    name: Synthetic benchmark + optional convert
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache separation model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch
            ~/.cache/huggingface
          key: demucs-htdemucs-v1

      - name: Install full dependencies
        run: |
          python -m pip install -U pip
          # CPU-only torch: the CUDA wheels are gigabytes and useless here.
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy librosa soundfile soxr mido pretty_midi \
                      onnxruntime mir_eval demucs lameenc pytest
          pip install --no-deps basic-pitch
          pip uninstall -y resampy 2>/dev/null || true

      - name: Show environment
        run: |
          python -c "import torch, librosa, onnxruntime as ort; \
            print('torch', torch.__version__); print('librosa', librosa.__version__); \
            print('ort', ort.__version__)"
          python -c "from midgenius import separation; \
            print('separation backend:', separation.available_backend())"

      - name: Ground-truth benchmark (self-contained, synthetic audio)
        run: |
          mkdir -p artifacts
          python tools/benchmark.py --keep artifacts | tee artifacts/benchmark.txt

      - name: Convert an audio file (only if one was provided and exists)
        env:
          AUDIO: ${{ github.event.inputs.audio }}
          QUALITY: ${{ github.event.inputs.quality || 'good' }}
        run: |
          if [ -n "$AUDIO" ] && [ -f "$AUDIO" ]; then
            python -m midgenius.cli "$AUDIO" -o artifacts/output.mid \
              --quality "$QUALITY" | tee artifacts/convert.txt
            python tools/audit.py "$AUDIO" artifacts/output.mid \
              --render artifacts/preview.wav | tee artifacts/audit.txt
          else
            echo "No audio provided (or file not found) - skipping conversion." \
              "The copyrighted demo tracks are not shipped; commit or upload" \
              "your own audio and pass its path to convert it." | tee artifacts/convert.txt
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midgenius-output
          path: artifacts/
          retention-days: 14
